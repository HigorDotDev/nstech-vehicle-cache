apiVersion: v1
kind: Service
metadata:
  name: connect
spec:
  selector: { app: connect }
  ports:
    - port: 8083
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: connect
spec:
  replicas: 1
  selector:
    matchLabels: { app: connect }
  template:
    metadata:
      labels: { app: connect }
    spec:
      # Service links would inject CONNECT_PORT=..., which the Debezium image turns into worker config.
      enableServiceLinks: false
      containers:
        - name: connect
          image: quay.io/debezium/connect:3.2.0.Final
          env:
            - { name: BOOTSTRAP_SERVERS, value: "kafka:9092" }
            - { name: GROUP_ID, value: "connect-cluster" }
            - { name: CONFIG_STORAGE_TOPIC, value: "connect_configs" }
            - { name: OFFSET_STORAGE_TOPIC, value: "connect_offsets" }
            - { name: STATUS_STORAGE_TOPIC, value: "connect_statuses" }
            - { name: CONFIG_STORAGE_REPLICATION_FACTOR, value: "1" }
            - { name: OFFSET_STORAGE_REPLICATION_FACTOR, value: "1" }
            - { name: STATUS_STORAGE_REPLICATION_FACTOR, value: "1" }
            - { name: HEAP_OPTS, value: "-Xms512m -Xmx768m" }
          ports:
            - containerPort: 8083
          readinessProbe:
            httpGet: { path: /connectors, port: 8083 }
            periodSeconds: 5
          resources:
            requests: { memory: 768Mi, cpu: 200m }
            limits: { memory: 1280Mi }
