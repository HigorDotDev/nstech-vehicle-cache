apiVersion: v1
kind: Service
metadata:
  name: valkey
spec:
  selector: { app: valkey }
  ports:
    - port: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
spec:
  replicas: 1
  selector:
    matchLabels: { app: valkey }
  template:
    metadata:
      labels: { app: valkey }
    spec:
      enableServiceLinks: false
      containers:
        - name: valkey
          image: valkey/valkey:8.1.3
          # No persistence: the cache is rebuildable from Kafka by design (ADR-0001).
          args: ["--save", "", "--appendonly", "no"]
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["valkey-cli", "ping"]
            periodSeconds: 3
          resources:
            requests: { memory: 64Mi, cpu: 50m }
            limits: { memory: 256Mi }
