apiVersion: batch/v1
kind: Job
metadata:
  name: verifier-expect
spec:
  backoffLimit: 0
  template:
    metadata:
      labels: { app: verifier }
    spec:
      restartPolicy: Never
      enableServiceLinks: false
      containers:
        - name: verifier
          image: vehicle-cache-verifier:local   # built by devspace (fixed tag: Jobs are applied by just, not devspace)
          imagePullPolicy: IfNotPresent
          args: ["expect", "--timeout", "180"]
          # Test harness: reads Postgres as the oracle (spec §9). The worker never gets these credentials.
          env:
            - { name: ConnectionStrings__Postgres, value: "Host=postgres;Username=postgres;Password=postgres;Database=fleet" }
            - { name: ConnectionStrings__Valkey, value: "valkey:6379" }
