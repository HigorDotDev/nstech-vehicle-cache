apiVersion: batch/v1
kind: Job
metadata:
  name: writers-scenario
spec:
  backoffLimit: 0   # a failed scenario must fail the run, not be retried on top of partial writes
  template:
    metadata:
      labels: { app: writers }
    spec:
      restartPolicy: Never
      enableServiceLinks: false
      containers:
        - name: writers
          image: vehicle-cache-writers:local   # built by devspace (fixed tag: Jobs are applied by just, not devspace)
          imagePullPolicy: IfNotPresent
          # ~1350 statements at 150/s ≈ 9 s: long enough for the e2e worker kill to land mid-stream (TB-12).
          args: ["scenario", "scenarios/e2e.json", "--rate", "150"]
          env:
            - { name: ConnectionStrings__Postgres, value: "Host=postgres;Username=postgres;Password=postgres;Database=fleet" }
